[project]
name = "pico-vllm"
version = "0.1.0"
description = "An educational single-GPU inference engine with paged KV caching and continuous batching."
readme = "README.md"
authors = [
    { name = "Gourav Sahu", email = "plutoe.info@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
pico-vllm = "pico_vllm.server.api:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
